# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration
name = "ReceiveKit"
client_id = "36a0a9aa745cf78c3a96d05f42bc043e"
# After `fly launch`, set these to the Fly hostname (no trailing slash), then
# `shopify app deploy`. Example: https://<your-app>.fly.dev
# SHOPIFY_APP_URL is a Fly secret — do not commit the real value.
application_url = "https://receivekit.fly.dev"
embedded = true

[build]
automatically_update_urls_on_dev = true

[access_scopes]
# Inventory receive + cost write. Native purchase-order *read* is attempted
# on the unstable Admin API (Physical inventory feature preview) and needs
# read_inventory_purchase_orders, which this app does not request.
# See README.md → API gaps.
scopes = "read_products,write_products,read_inventory,write_inventory,read_locations,read_inventory_transfers,write_inventory_transfers,write_inventory_shipments,write_inventory_shipments_received_items"

[auth]
redirect_urls = [ "https://receivekit.fly.dev/api/auth" ]

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = ["customers/data_request"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = ["customers/redact"]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = ["shop/redact"]
