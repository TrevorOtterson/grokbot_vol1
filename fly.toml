# fly.toml app configuration file generated for receivekit on 2026-09-15T18:58:57Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'receivekit'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
